version: '3.8'

services:
  db:
    image: postgres:15
    container_name: medflow_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medflow_db
    ports:
      - "5432:5432"
    volumes:
     - pgdata:/var/lib/postgresql/data
     - ./src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
      

  backend:
    build: .
    container_name: medflow_backend
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/medflow_db
      JWT_SECRET: secret_key_123

volumes:
  pgdata: