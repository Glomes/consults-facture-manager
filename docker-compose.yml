
services:
  db:
    image: postgres:15
    container_name: medflow_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medflow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: medflow_backend
    restart: always
    depends_on:
      - db
    env_file:
    - .env
    ports:
      - "10000:10000"

volumes:
  pgdata: